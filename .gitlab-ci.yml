variables:
  BUILD_DIR: "$CI_PROJECT_DIR/build"
  PREFIX_DIR: "$CI_PROJECT_DIR/osg-dist"
  # FIXME detect this using vswhere 
  VS160COMNTOOLS: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\BuildTools\\Common7\\Tools"
  VCVARSALL: "${VS160COMNTOOLS}\\..\\..\\VC\\Auxiliary\\Build\\vcvarsall.bat"
  VCVARSPLATFORM: "x64"
  VCVARSVERSION: "14.29.30133"

  WIN_FG_DIR: $CI_BUILDS_DIR\flightgear


windows_build:
  stage: build
  tags:
    - windows
  before_script:
  #  - ls "C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\BuildTools\\VC\\Tools\MSVC\\"
    - Invoke-Expression -Command .gitlab\vcvarsall.ps1
  script:
    - cmake -B $BUILD_DIR -S $CI_PROJECT_DIR -G Ninja
        -Wno-dev
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DOSG_USE_UTF8_FILENAME:BOOL=ON
        -DACTUAL_3RDPARTY_DIR:PATH=$CI_PROJECT_DIR\msvc140\3rdparty.x64 
        -DCMAKE_INSTALL_PREFIX:PATH=$PREFIX_DIR
        -DCMAKE_RELWITHDEBINFO_POSTFIX=
    - cmake --build $BUILD_DIR
    - cmake --build $BUILD_DIR --target install
  needs:
    - project: flightgear/windows-3rd-party
      job: windows_build_msvc140
      ref: master
      artifacts: true
  artifacts:
    paths:
      - $PREFIX_DIR
    exclude:
      - $PREFIX_DIR/lib/pkgconfig/*

macos-build:
  stage: build
  tags:
    - saas-macos-medium-m1
  image: macos-12-xcode-14
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  before_script:
      - export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
      - export HOMEBREW_NO_INSTALL_CLEANUP=1
      - brew install ninja cmake 
  script:
  # ensure we use our FreeType and not the one from Homebrew
  # ours is UB, HomeBrew's is not
    - export FREETYPE_DIR=$CI_PROJECT_DIR/dist
  # FontConfig disabled for now: we find it via HomeBrew and it's not UB
  # JPEG disabled becuase we use CoreImageIO loader anyway on macOS
    - cmake -B $BUILD_DIR -S $CI_PROJECT_DIR -G Ninja -Wno-dev
        -DCMAKE_BUILD_TYPE=RelWithDebInfo 
        -DCMAKE_INSTALL_PREFIX=$PREFIX_DIR 
        -DOSG_WINDOWING_SYSTEM=Cocoa 
        -DOSG_USE_QT=0 
        -DCMAKE_RELWITHDEBINFO_POSTFIX=
        -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
        -DOSG_TEXT_USE_FONTCONFIG=0
        -DBUILD_OSG_PLUGIN_JPEG=0
        -DBUILD_OSG_PLUGIN_TIFF=0
    - cmake --build $BUILD_DIR
    - cmake --build $BUILD_DIR --target install
  needs:
    - project: flightgear/macos-3rd-party
      job: macos-build
      ref: main
      artifacts: true
  artifacts:
    paths:
      - $PREFIX_DIR
    exclude:
      - $PREFIX_DIR/lib/pkgconfig/*
  cache:
    paths:
      - $BUILD_DIR