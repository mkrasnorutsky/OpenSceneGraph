variables:
  BUILD_DIR: "$CI_PROJECT_DIR/build"
  PREFIX_DIR: "$CI_PROJECT_DIR/dist"
  NUGET_PACKAGES_DIRECTORY: '.nuget'

build:
  image: registry.gitlab.com/flightgear/flightgear
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  before_script:
    - cl
    - msbuild
    - dir
  script:
    - cmake -B $BUILD_DIR -S $CI_PROJECT_DIR -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=$PREFIX_DIR
    - cmake --build $BUILD_DIR
    - cmake --build $BUILD_DIR --target install
  artifacts:
    paths:
      - $PREFIX_DIR
  cache:
    paths:
      - $BUILD_DIR

windows_build:
  stage: build
  tags:
    - windows
  allow_failure: true
  before_script:
   # - 'nuget restore --packages $NUGET_PACKAGES_DIRECTORY'
 #   - nuget install cmake 
#    - nuget install autom8ed.com.tools.ninja
  script:
    - cmake
    - cmake -B $BUILD_DIR -S $CI_PROJECT_DIR -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - cmake --build $BUILD_DIR
    - cmake --build $BUILD_DIR --target install
  needs:
    - project: flightgear/windows-3rd-party
      job: windows_build_msvc140
      ref: master
      artifacts: true
  artifacts:
    paths:
      - $PREFIX_DIR

macos-build:
  stage: build
  tags:
    - saas-macos-medium-m1
  image: macos-12-xcode-14
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  before_script:
      - brew install ninja cmake 
  script:
    - cmake -B $BUILD_DIR -S $CI_PROJECT_DIR -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=$PREFIX_DIR
    - cmake --build $BUILD_DIR
    - cmake --build $BUILD_DIR --target install
  needs:
    - project: flightgear/macos-3rd-party
      job: macos-build
      ref: main
      artifacts: true
  artifacts:
    paths:
      - $PREFIX_DIR
  cache:
    paths:
      - $BUILD_DIR

